[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "songsored"
version = "0.1.0"
description = "Experimental one-second target-word classification components"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Amine AIT ELAMIRI"}]
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.7.1",
  "transformers==4.57.6",
  "librosa==0.10.2.post1",
  "numpy==2.0.2",
  "scipy==1.17.1",
  "soundfile==0.13.1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
ctc = ["onnxruntime==1.31.0"]
train = ["matplotlib==3.11.0"]
alignment = ["torchaudio==2.7.1", "uroman==1.3.1.1"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["songsored*"]
